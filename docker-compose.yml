services:
  db:
    image: pgvector/pgvector:pg17
    container_name: research-ai-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sentiment_hub
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sentiment_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-test:
    image: pgvector/pgvector:pg17
    container_name: research-ai-db-test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sentiment_hub_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sentiment_hub_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
