name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres-test:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sentiment_hub_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # dependency scanning (§B9.9)
      - run: npm audit --audit-level=high

      - run: npx tsc --noEmit

      # unit + integration incl. golden-question and permission-boundary suites
      - run: npm test

      # browser e2e incl. monthly-wave journey and permission boundaries
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e
